<script>
  // On pages without the Categories list (About, posts), add it on the right
  (function () {
    var main = document.querySelector('main#quarto-document-content');
    if (!main || main.querySelector('.category-nav')) return;
    var layout = document.createElement('div'); layout.className = 'site-layout';
    var left = document.createElement('div'); left.className = 'site-main';
    var side = document.createElement('div'); side.className = 'site-side';
    while (main.firstChild) left.appendChild(main.firstChild);
    side.innerHTML = '<nav class="category-nav" aria-label="Categories"><div class="category-nav-title">Categories</div><a href="/index.html" data-page="index">All</a><a href="/gaming.html" data-page="gaming">Gaming</a><a href="/thoughts.html" data-page="thoughts">Thoughts</a><a href="/research.html" data-page="research">Research</a><a href="/gallery.html" data-page="gallery">Gallery</a></nav>';
    layout.appendChild(left); layout.appendChild(side); main.appendChild(layout);
  })();
</script>
<script>
  // Keep the page title inside the left column so Categories always starts at the same height
  (function () {
    var t = document.getElementById('title-block-header'), m = document.querySelector('.site-layout .site-main');
    if (t && m && !m.contains(t)) m.insertBefore(t, m.firstChild);
  })();
  // Open links to other sites (Twitch, YouTube, etc.) in a new tab
  document.querySelectorAll('a[href^="http"]').forEach(function (a) {
    if (a.hostname !== location.hostname) { a.target = '_blank'; a.rel = 'noopener'; }
  });
  // Highlight the current category
  var parts = location.pathname.split('/');
  var page = (parts.pop() || 'index.html').replace('.html', '') || 'index';
  var sec = location.pathname.match(/\/posts\/([^\/]+)\//); if (sec) page = sec[1];
  if (/\/gallery\//.test(location.pathname)) page = 'gallery';
  document.querySelectorAll('.category-nav a').forEach(function (a) {
    if (a.dataset.page === page) a.classList.add('active');
  });
</script>
<script>
  // Open photos in a preview on the page (instead of going to the image file)
  (function () {
    if (window.GLightbox || !document.querySelector('a.lightbox')) return; // Quarto already handles pages with post images
    var css = document.createElement('link'); css.rel = 'stylesheet'; css.href = '/assets/glightbox/glightbox.min.css';
    document.head.appendChild(css);
    var js = document.createElement('script'); js.src = '/assets/glightbox/glightbox.min.js';
    js.onload = function () { GLightbox({ selector: '.lightbox', loop: true }); };
    document.body.appendChild(js);
  })();
</script>
<script>
  // Gallery videos: play muted on hover, open with sound and controls on click
  (function () {
    var tiles = document.querySelectorAll('.video-tile');
    if (!tiles.length) return;
    var hover = window.matchMedia('(hover: hover)').matches;
    tiles.forEach(function (tile) {
      var v = tile.querySelector('video');
      if (hover) {
        tile.addEventListener('mouseenter', function () { v.muted = true; v.play().catch(function () {}); });
        tile.addEventListener('mouseleave', function () { v.pause(); });
      }
      tile.addEventListener('click', function (e) {
        e.preventDefault(); v.pause();
        var box = document.createElement('div'); box.className = 'video-modal';
        box.innerHTML = '<button class="video-close" aria-label="Close">&times;</button>' +
          '<video controls autoplay playsinline></video>' +
          (tile.dataset.description ? '<div class="video-caption"></div>' : '');
        var big = box.querySelector('video'); big.src = tile.dataset.video;
        if (tile.dataset.description) box.querySelector('.video-caption').textContent = tile.dataset.description;
        function close() { big.pause(); box.remove(); document.removeEventListener('keydown', onKey); }
        function onKey(ev) { if (ev.key === 'Escape') close(); }
        box.addEventListener('click', function (ev) { if (ev.target === box || ev.target.classList.contains('video-close')) close(); });
        document.addEventListener('keydown', onKey);
        document.body.appendChild(box);
        big.play().catch(function () {});
      });
    });
  })();
</script>
