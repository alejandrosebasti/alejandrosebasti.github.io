<script>
  // On pages without the Categories list (like About), add it on the right
  (function () {
    var main = document.querySelector('main#quarto-document-content');
    if (!main || main.querySelector('.category-nav') || !/about(\.html)?$/.test(location.pathname)) return;
    var layout = document.createElement('div'); layout.className = 'site-layout';
    var left = document.createElement('div'); left.className = 'site-main';
    var side = document.createElement('div'); side.className = 'site-side';
    while (main.firstChild) left.appendChild(main.firstChild);
    side.innerHTML = '<nav class="category-nav" aria-label="Categories"><div class="category-nav-title">Categories</div><a href="index.html" data-page="index">All</a><a href="gaming.html" data-page="gaming">Gaming</a><a href="thoughts.html" data-page="thoughts">Thoughts</a><a href="research.html" data-page="research">Research</a><a href="gallery.html" data-page="gallery">Gallery</a></nav>';
    layout.appendChild(left); layout.appendChild(side); main.appendChild(layout);
  })();
</script>
<script>
  // Open links to other sites (Twitch, YouTube, etc.) in a new tab
  document.querySelectorAll('a[href^="http"]').forEach(function (a) {
    if (a.hostname !== location.hostname) { a.target = '_blank'; a.rel = 'noopener'; }
  });
  // Highlight the current category
  var page = (location.pathname.split('/').pop() || 'index.html').replace('.html', '') || 'index';
  document.querySelectorAll('.category-nav a').forEach(function (a) {
    if (a.dataset.page === page) a.classList.add('active');
  });
</script>
