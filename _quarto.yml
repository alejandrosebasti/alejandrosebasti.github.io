project:
  type: website
  output-dir: _site
  resources:
    - "images/**"
  render:
    - "*.qmd"
    - "about.md"
    - "posts/**/*.md"
    - "gallery/*.md"

website:
  title: "rechu"
  description: "Reviews, thoughts, research and photos."
  site-url: ""
  navbar:
    left:
      - text: About
        href: about.md
      - text: Twitter
        href: https://x.com/99rechu
      - text: Twitch
        href: https://www.twitch.tv/rechu
      - text: YouTube
        href: https://www.youtube.com/@rechu

format:
  html:
    theme: [darkly, dark.scss, styles.scss]
    toc: false
    smooth-scroll: true
    lightbox: true
    include-after-body: _newtab.html
